{% set name = "optbinning" %}
{% set version = "0.20.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/guillermo-navas-palencia/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 8c6d9e0a3731448ce41e99687d221bfc40eb9c753d44ba1fe2cc86bcd6a4573a
  patches:
    # Relax the upstream OR-Tools <9.12 constraint on Windows to use OR-Tools 9.15 and avoid known issues with older Windows builds.
    - 0001-allow-ortools9.15.patch # [win]

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  # Follow upstream compatibility: optbinning 0.20.1 supports Python 3.7+,
  # but OR-Tools <9.12 does not provide builds for Python >3.12.
  skip: true  # [py<310 or py>312]

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - matplotlib-base
    - numpy >=1.16.1
    # Extend the upstream OR-Tools range through 9.15.x for newer Python and Windows builds.
    - ortools-python >=9.4,<=9.15 #[win]
    - ortools-python >=9.4,<9.12 #[unix]
    - pandas
    - ropwr >=1.0.0
    - scikit-learn >=1.0.2
    - scipy >=1.6.0
    # CVXPY 1.7.3 aborts in native cvxcore on osx-arm64/Python 3.10;
    # pin to the latest working 1.7.x release available for this environment.
    # - cvxpy <1.7.3 # [osx and py==310]

# tdigest is not available in the configured Anaconda channels.
{% set deselected_tests = "--deselect=tests/test_binning_sketch.py::test_numerical_default_tdigest" %}
{% set deselected_tests = deselected_tests + " --deselect=tests/test_binning_sketch.py::test_numerical_default_tdigest_merge" %}
{% set deselected_tests = deselected_tests + " --deselect=tests/test_binning_process_sketch.py::test_default_tdigest_merge" %}

# Individual tests require the remote Boston Housing dataset at runtime, which returns HTTP 403.
{% set deselected_tests = deselected_tests + " --deselect=tests/test_binning_process.py::test_categorical_variables" %}
{% set deselected_tests = deselected_tests + " --deselect=tests/test_binning_process.py::test_default_transform_continuous" %}
{% set deselected_tests = deselected_tests + " --deselect=tests/test_scorecard.py::test_scaling_method_params_continuous_pdo_odds" %}
{% set deselected_tests = deselected_tests + " --deselect=tests/test_scorecard.py::test_default_continuous" %}
{% set deselected_tests = deselected_tests + " --deselect=tests/test_scorecard_monitoring.py::test_default_continuous" %}
{% set deselected_tests = deselected_tests + " --deselect=tests/test_scorecard_monitoring.py::test_information" %}
{% set deselected_tests = deselected_tests + " --deselect=tests/test_scorecard_monitoring.py::test_verbose" %}
{% set deselected_tests = deselected_tests + " --deselect=tests/test_scorecard_monitoring.py::test_plot_continuous" %}

# Upstream piecewise tests are sensitive to numerical differences with newer solver versions;
# this is partially addressed upstream and may pass in future releases.
{% set deselected_tests = deselected_tests + " --deselect=tests/test_binning_piecewise.py::test_default_discontinuous" %}
{% set deselected_tests = deselected_tests + " --deselect=tests/test_binning_piecewise.py::test_bounds_transform" %}
{% set deselected_tests = deselected_tests + " --deselect=tests/test_binning_piecewise.py::test_bounds_fit_transform" %}

# Upstream test is incompatible with newer scikit-learn categorical-data handling;
# this may be resolved in a future upstream release.
{% set deselected_tests = deselected_tests + " --deselect=tests/test_scorecard.py::test_missing_metrics" %}

# Test modules load the remote Boston Housing dataset during collection, which returns HTTP 403.
{% set ignored_tests = "--ignore=tests/test_continuous_binning.py" %}
{% set ignored_tests = ignored_tests + " --ignore=tests/test_continuous_binning_2d.py" %}
{% set ignored_tests = ignored_tests + " --ignore=tests/test_continuous_binning_piecewise.py" %}
{% set ignored_tests = ignored_tests + " --ignore=tests/test_outlier.py" %}
{% set ignored_tests = ignored_tests + " --ignore=tests/test_counterfactual.py" %}

test:
  source_files:
    - tests
  imports:
    - optbinning
  requires:
    - pip
    - pytest
    - pyarrow
    - pympler
    - ecos
  commands:
    - pip check
    - pytest -v {{ deselected_tests }} {{ ignored_tests }} tests

about:
  home: https://github.com/guillermo-navas-palencia/optbinning
  summary: OptBinning is a Python library for optimal binning.
  description: |
    OptBinning implements optimal binning algorithms for binary,
    continuous and multiclass targets, as well as scorecard modelling
    and related optimization methods.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  dev_url: https://github.com/guillermo-navas-palencia/optbinning
  doc_url: https://gnpalencia.org/optbinning

extra:
  recipe-maintainers:
    - Jrice1317
