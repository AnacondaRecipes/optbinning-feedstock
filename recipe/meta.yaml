{% set name = "optbinning" %}
{% set version = "1.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/guillermo-navas-palencia/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: d80e2b2c75c53fb4eba7011e129ebfb0e0beba344cf772aa7f0d86d6c1edf45e

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  # Upstream supports Python 3.11-3.13
  skip: true  # [py<311 or py>313]

requirements:
  host:
    - python
    - pip
    - setuptools >=77
    - wheel
  run:
    - python
    - matplotlib-base
    - numpy {{ numpy }}
    - ortools-python >=9.15
    - pandas
    - ropwr >=1.0.0
    - scikit-learn >=1.6.0
    - scipy >=1.6.0

# The optional tdigest dependency is not available in Anaconda channels.
# Deselect tests that explicitly exercise the t-digest sketch implementation.
{% set deselected_tests = "--deselect=tests/test_binning_process_sketch.py::test_default_tdigest_merge" %}
{% set deselected_tests = deselected_tests + " --deselect=tests/test_binning_sketch.py::test_numerical_default_tdigest" %}
{% set deselected_tests = deselected_tests + " --deselect=tests/test_binning_sketch.py::test_numerical_default_tdigest_merge" %}

test:
  source_files:
    - tests
  imports:
    - optbinning
  requires:
    - pip
    - pytest
    - pyarrow
    - pympler
    - ecos
  commands:
    - pip check
    - pytest -v {{ deselected_tests }} tests

about:
  home: https://github.com/guillermo-navas-palencia/optbinning
  summary: OptBinning is a Python library for optimal binning.
  description: |
    OptBinning implements optimal binning algorithms for binary,
    continuous and multiclass targets, as well as scorecard modelling
    and related optimization methods.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  dev_url: https://github.com/guillermo-navas-palencia/optbinning
  doc_url: https://gnpalencia.org/optbinning

extra:
  recipe-maintainers:
    - Jrice1317
